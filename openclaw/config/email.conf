# Email triage configuration.
# Inbox list — one per line, format:
#   slug|username|env_var_name_for_password
#
# slug is used in state files and notifications (keep short, [a-z0-9-]).
# env_var_name is the variable inside ~/.openclaw-monitor/.env that holds
# the IMAP app-password for that user.

# IMAP server (single Mailcow host for all three)
IMAP_HOST=mail.schiffer.se
IMAP_PORT=993
IMAP_MAILBOX=INBOX

# Anthropic model used for classification — small/cheap is fine here.
CLASSIFIER_MODEL=claude-haiku-4-5-20251001

# How many recent unseen messages to scan on each cron run (cap to limit cost
# and avoid blasting Claude with a backlog after a long downtime).
MAX_PER_RUN=20

# Inboxes (slug | imap user | env var with password)
#
# To add a new inbox later:
#   1. Add a line here: my-slug | user@domain.tld | IMAP_PASS_MY_SLUG
#      - slug: short, [a-z0-9-], used in state files and Telegram alerts
#      - env var: any name starting with IMAP_PASS_ (must match what you'll
#        store the password under in ~/.openclaw-monitor/.env)
#   2. Re-run: bash openclaw/scripts/05-install-email-triage.sh
#      The installer will only prompt for inboxes whose password is missing.
INBOXES="
tschiffer-agile   | tschiffer@agiletransition.se | IMAP_PASS_TSCHIFFER_AGILE
thomas-agile      | thomas@agiletransition.se    | IMAP_PASS_THOMAS_AGILE
thomas-euproof    | thomas@euproof.eu            | IMAP_PASS_THOMAS_EUPROOF
getengaged-euproof| getengaged@euproof.eu        | IMAP_PASS_GETENGAGED_EUPROOF
"
