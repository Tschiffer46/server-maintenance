# Infrastructure check thresholds and expected containers.
# Edit and `bash openclaw/scripts/infra-check.sh` to test changes.

# Disk: percent used at / — alert above this
DISK_WARN_PCT=85
DISK_CRIT_PCT=95

# Memory: percent used (excluding buff/cache) — alert above this
MEM_WARN_PCT=90

# Swap: percent used — alert above this (0 means: never alert)
SWAP_WARN_PCT=50

# Load average (1-min) divided by CPU count — alert above this
LOAD_WARN_RATIO=4

# Expected Docker containers (space-separated). Alert if any is not "running".
EXPECTED_CONTAINERS="azprofil-shopware azprofil-redis npm"

# Systemd services that must be active (space-separated).
EXPECTED_SERVICES="fail2ban ufw docker ssh"
