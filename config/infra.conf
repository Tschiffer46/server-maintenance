# Hermes infrastruktur-övervakning
# Uppdatera värden här – kör sedan phase4-setup-infra.sh på servern.

# === Mailcow-server (separat Hetzner-server) ===
# Hermes ansluter med id_ed25519_mailcow som root (befintlig nyckel,
# kopierad från Mac till hermes-användaren). Härdas i fas 8 till en
# dedikerad lågprivilegierad monitoring-användare.
MAILCOW_HOST=204.168.157.75
MAILCOW_SSH_USER=root
MAILCOW_SSH_KEY=/home/hermes/.ssh/id_ed25519_mailcow
# Portar som Mailcow ska lyssna på (kontrolleras utifrhån)
MAILCOW_PORTS="25 465 587 993"

# === Web-hosting-prod (separat Hetzner-server) ===
# Hermes ansluter med id_ed25519_monitoring som deploy (dedikerad nyckel,
# genererad på ATM-shops, publik nyckel tillagd i web-hosting authorized_keys).
WEBHOSTING_HOST=89.167.90.112
WEBHOSTING_SSH_USER=deploy
WEBHOSTING_SSH_KEY=/home/hermes/.ssh/id_ed25519_monitoring

# === Tröskelvärden ===
DISK_WARN_PERCENT=80
DISK_CRIT_PERCENT=90
MEM_WARN_PERCENT=85
MEM_CRIT_PERCENT=95
